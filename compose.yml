# Shared by the three containers built from backend/: the Daphne web server
# (backend), the Celery worker and Celery beat. Same image, same settings —
# each service only changes the command, healthcheck and dependencies.
x-backend: &backend
  image: skeleton-backend:latest
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_HOST: db
    DB_PORT: 5432
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
    DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
    SEAWEEDFS_S3_ENDPOINT: http://seaweedfs:8333
    SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
    SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-skeleton}
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    - media_data:/app/media
  networks:
    - app-network

services:
  db:
    image: postgres:17-alpine
    container_name: skeleton_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose: only the backend container
    # (on app-network) needs to reach Postgres. Uncomment to allow psql
    # or a backup tool from the host during troubleshooting:
    # ports:
    #   - "127.0.0.1:5432:5432"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: skeleton_seaweedfs
    restart: unless-stopped
    # Single-process cluster: master + volume + filer + S3 gateway (:8333).
    command: server -s3 -ip.bind=0.0.0.0
    environment:
      # With no -s3.config file, these become the S3 admin identity.
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
    volumes:
      - seaweedfs_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose: only the backend containers
    # (on app-network) need to reach SeaweedFS. Uncomment to hit the S3 API
    # (8333) or the filer UI (8888) directly while troubleshooting:
    # ports:
    #   - "127.0.0.1:8333:8333"
    #   - "127.0.0.1:8888:8888"

  redis:
    image: redis:8.8-alpine
    container_name: skeleton_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose: Celery broker + Channels layer,
    # internal only. Uncomment to inspect with redis-cli from the host:
    # ports:
    #   - "127.0.0.1:6379:6379"

  backend:
    <<: *backend
    container_name: skeleton_backend
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Not published to the host by default — nginx (frontend) is the only
    # public entry point, proxying /api/, /media/ and /ws/ internally. Uncomment
    # for direct access to /admin/ or the API while debugging:
    # ports:
    #   - "127.0.0.1:8000:8000"

  celery_worker:
    <<: *backend
    container_name: skeleton_celery_worker
    command: celery -A config worker -Q default,periodic -l info
    # Waits for the web container, whose entrypoint applies the migrations —
    # so no task ever runs against a schema that's still being migrated.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3

  celery_beat:
    <<: *backend
    container_name: skeleton_celery_beat
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      backend:
        condition: service_healthy
    # beat only publishes to Redis on schedule; there's nothing to probe.
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skeleton_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  media_data:
  seaweedfs_data:
  redis_data:

networks:
  app-network:
    driver: bridge
