server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the backend lazily (per request,
    # via a variable in proxy_pass below) means this container starts fine
    # even if "backend" isn't up yet or isn't reachable at all.
    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Angular build output is content-hashed; safe to cache long-term.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + uploaded report/media downloads: proxied to the Django container.
    # No path after $backend in proxy_pass — with a variable, nginx forwards
    # the original request URI as-is instead of prefix-rewriting it, which
    # is exactly what we want since Django's own URLs already start with
    # /api/ and /media/.
    location /api/ {
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    # WebSocket (Django Channels, served by daphne): same origin as the app,
    # so the browser connects to ws(s)://<host>/ws/... with no CORS setup.
    location /ws/ {
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Angular router: any other path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
