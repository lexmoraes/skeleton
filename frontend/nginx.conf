# Same as nginx's default "combined" format, minus the query string: the
# WebSocket handshake carries the JWT as ?token=..., which must not end up in
# access logs. Used by the /ws/ location below.
log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the backend lazily (per request,
    # via a variable in proxy_pass below) means this container starts fine
    # even if "backend" isn't up yet or isn't reachable at all.
    resolver 127.0.0.11 valid=30s;

    # Largest request body (file uploads) passed on to Django. nginx's
    # default is 1m, which rejects bigger uploads with a 413.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers. NOTE: nginx only inherits add_header directives into a
    # location that declares none of its own — every location below that adds
    # a header must re-include this file's headers (see /etc/nginx/security-headers.conf).
    include /etc/nginx/security-headers.conf;

    # Angular build output is content-hashed; safe to cache long-term.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is NOT hashed: always revalidate, so a new deploy (new
    # bundle names) is picked up immediately instead of after a stale cache.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # API + uploaded report/media downloads: proxied to the Django container.
    # No path after $backend in proxy_pass — with a variable, nginx forwards
    # the original request URI as-is instead of prefix-rewriting it, which
    # is exactly what we want since Django's own URLs already start with
    # /api/ and /media/.
    location /api/ {
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Django Channels, served by daphne): same origin as the app,
    # so the browser connects to ws(s)://<host>/ws/... with no CORS setup.
    location /ws/ {
        access_log /var/log/nginx/access.log no_query;
        set $backend "backend:8000";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Angular router: any other path falls back to index.html (served by the
    # exact-match location above, so it gets the no-cache header too).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
