# Included by nginx.conf at server level AND in every location that sets its
# own add_header (nginx drops inherited add_header otherwise).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Allows the Google Fonts / cdnjs (Font Awesome) stylesheets in src/index.html.
# If you self-host fonts/icons, drop those hosts. 'unsafe-inline' for styles is
# required by Angular's component styles and Material.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
